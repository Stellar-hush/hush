name: Refresh Visual Snapshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    name: Generate Linux visual baselines
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: ./node_modules/.bin/playwright install --with-deps chromium firefox webkit

      - name: Regenerate visual snapshots
        run: bun run test:visual:update

      - name: Upload regenerated snapshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-visual-snapshots
          path: tests/e2e/visual/__screenshots__/
          retention-days: 7
          if-no-files-found: error
